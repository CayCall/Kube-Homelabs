        cp /opt/docker/redis/mounted-etc/redis.conf /opt/docker/redis/etc/redis.conf
    fi
    if [[ -f /opt/docker/redis/mounted-etc/users.acl ]];then
        cp /opt/docker/redis/mounted-etc/users.acl /opt/docker/redis/etc/users.acl
    fi

    echo "" >> /opt/docker/redis/etc/replica.conf
    echo "replica-announce-port $REDISPORT" >> /opt/docker/redis/etc/replica.conf
